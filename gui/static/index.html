<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mlx-bonsai-beater</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="dot" id="route-dot"></span>
      <span id="route-label">连接中…</span>
    </div>
    <button id="new-chat" class="btn primary">＋ 新对话</button>

    <div class="field">
      <label>模型</label>
      <select id="model-select"></select>
    </div>

    <div class="field">
      <label>System Prompt</label>
      <textarea id="system-prompt" rows="4" placeholder="可选，设定助手角色"></textarea>
    </div>

    <div class="field">
      <label>温度 <span id="temp-val">0.7</span></label>
      <input type="range" id="temp" min="0" max="2" step="0.05" value="0.7">
    </div>

    <div class="field">
      <label>最大 token</label>
      <input type="number" id="max-tokens" value="1024" min="16" step="16">
    </div>

    <div id="params-hint">主备路由：主断自动兜底本机</div>
  </aside>

  <main id="main">
    <header id="bar">
      <span id="route-badge" class="badge"></span>
      <button id="stop" class="btn hidden">⏹ 停止</button>
    </header>
    <div id="chat"></div>
    <footer id="composer">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" class="btn primary">发送</button>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
